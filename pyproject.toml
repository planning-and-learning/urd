[build-system]
requires = [
    "scikit-build-core>=1.0.3,<2",
    "pybrokkr>=0.1.1,<0.2",
]
build-backend = "pyurd_build_backend"
backend-path = ["python"]

[project]
name = "pyurd"
version = "0.1.0"
description = "urd's headers and the native dependencies of Dominik Drexler's planning projects"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Dominik Drexler", email = "dominik.drexler@liu.se"},
]

[project.optional-dependencies]
test = [
    "pytest",
    # The build backend wraps pybrokkr; installed here so type checkers
    # resolve it (it is otherwise only a build-system requirement).
    "pybrokkr>=0.1.1,<0.2",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[project.urls]
Homepage = "https://github.com/planning-and-learning/urd"

[tool.scikit-build]
build.targets = ["pyurd_wheel"]
cmake.build-type = "Release"
install.components = ["pyurd"]
wheel.packages = []
# The wheel ships native libraries but no extension module: tag it for the platform, for any CPython 3.
wheel.platlib = true
wheel.py-api = "py3"

[tool.scikit-build.sdist]
include = [
    "CMakeLists.txt",
    "cmake/**",
    "docs/**",
    "include/**",
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "python/**",
    "share/**",
    "src/**",
]
exclude = [
    "build*/**",
    "dependencies-build/**",
    "dependencies-install/**",
    "*.egg-info/**",
]

[tool.scikit-build.cmake.define]
URD_NATIVE_PREFIX = {env = "URD_NATIVE_PREFIX", default = "dependencies-install"}
URD_BUILD_TESTS = false
URD_BUILD_EXAMPLES = false
URD_BUILD_BENCHMARKS = false
CMAKE_INSTALL_LIBDIR = "lib"

[tool.cibuildwheel]
build = "cp311-*"
container-engine = "docker"
test-requires = ["cmake>=3.21"]
test-command = "python {project}/python/tests/test_mpi.py"

[tool.cibuildwheel.linux]
repair-wheel-command = "LD_LIBRARY_PATH=$(python -c 'import os, pathlib; prefix = pathlib.Path(\"dependencies-install\"); print(os.pathsep.join(str(path) for path in sorted(prefix.glob(\"lib*\")) if path.is_dir()))') auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
