[build-system]
requires = [
    "scikit-build-core>=1.0.3,<2",
    "pybrokkr>=0.1.2,<0.2",
    "pyurd-native==0.1.1",
]
build-backend = "pyurd_build_backend"
backend-path = ["python"]

[project]
name = "pyurd"
version = "0.1.1"
description = "urd: containers described by what the data is, as headers and a CMake package"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Dominik Drexler", email = "dominik.drexler@liu.se"},
]
# The dependencies urd's headers include (Boost, cista, gtl, fmt) and those of the libraries built on urd: one
# prefix, pinned exactly, released only when a dependency changes.
dependencies = [
    "pyurd-native==0.1.1",
]

[project.optional-dependencies]
test = [
    "pytest",
    # The build backend wraps pybrokkr; installed here so type checkers
    # resolve it (it is otherwise only a build-system requirement).
    "pybrokkr>=0.1.2,<0.2",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[project.urls]
Homepage = "https://github.com/planning-and-learning/urd"

[tool.scikit-build]
build.targets = ["pyurd_wheel"]
cmake.build-type = "Release"
install.components = ["pyurd"]
wheel.packages = []
# Headers, CMake files and Python only: one wheel for every platform.
wheel.platlib = false

# Everything the repository tracks, except pyurd-native's project (python/pyproject.toml and what only it uses).
[tool.scikit-build.sdist]
exclude = [
    "/python/pyproject.toml",
    "/python/pyurd_native_build_backend.py",
    "/python/native/**",
    "/python/src/pyurd_native/**",
    "/python/dependencies-build/**",
    "/python/dependencies-install/**",
    "/.pytest_cache/**",
    "*.egg-info/**",
]

[tool.scikit-build.cmake.define]
URD_BUILD_TESTS = false
URD_BUILD_EXAMPLES = false
URD_BUILD_BENCHMARKS = false
CMAKE_INSTALL_LIBDIR = "lib"
