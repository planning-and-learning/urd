name: Release pyurd-native

# pyurd-native: the native dependencies, as platform wheels and their source distribution. Released only when a pin
# in python/native/SOURCES.json or a dependency's build changes; pyurd (release.yml) pins the version released here.

on:
  push:
    tags:
      - "native-v*"

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  URD_JOBS: "2"

jobs:
  build_native_sdist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build source distribution
        run: python -m build --sdist python --outdir native-dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v5
        with:
          name: native-sdist
          path: native-dist/*.tar.gz

  build_corresponding_source:
    needs: build_native_sdist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download source distribution
        uses: actions/download-artifact@v5
        with:
          name: native-sdist
          path: native-dist

      - name: Download upstream sources
        run: |
          cmake -S python/native -B source-build \
                -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/urd-source-prefix" \
                -DCMAKE_INSTALL_LIBDIR=lib \
                -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          cmake --build source-build --target corresponding-source-downloads --parallel 2

      - name: Build corresponding-source bundle
        run: |
          SDISTS=(native-dist/*.tar.gz)
          test "${#SDISTS[@]}" -eq 1
          test -f "${SDISTS[0]}"
          SOURCE_ARCHIVE=${SDISTS[0]#native-dist/}
          SOURCE_ARCHIVE=${SOURCE_ARCHIVE%.tar.gz}-corresponding-source.tar.gz
          mkdir -p release-assets
          python cmake/build_corresponding_source.py \
            --manifest python/native/SOURCES.json \
            --sdist "${SDISTS[0]}" \
            --sources source-build \
            --output "release-assets/${SOURCE_ARCHIVE}"

      - name: Upload corresponding-source artifact
        uses: actions/upload-artifact@v5
        with:
          name: corresponding-source
          path: release-assets/*.tar.gz

  build_native_wheels_linux:
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: ["x86_64", "aarch64"]
        python-version: ["cp311"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir cibuildwheel

      # python/ is pyurd-native's project; cibuildwheel copies the repository, from whose root it runs, into the container.
      - name: Build Linux wheels
        run: cibuildwheel python --output-dir wheelhouse
        env:
          CIBW_ENVIRONMENT: "URD_JOBS=2 CMAKE_BUILD_PARALLEL_LEVEL=2"
          CIBW_PLATFORM: linux
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: "${{ matrix.architecture }}"
          CIBW_BUILD_VERBOSITY: "1"

      - name: Upload Linux wheels artifact
        uses: actions/upload-artifact@v5
        with:
          name: native-wheels-linux-${{ matrix.python-version }}-${{ matrix.architecture }}
          path: wheelhouse/*.whl

  build_native_wheels_macos:
    runs-on: ${{ matrix.architecture == 'x86_64' && 'macos-15-intel' || 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: ["arm64", "x86_64"]
        python-version: ["cp311"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir cibuildwheel

      - name: Build macOS wheels
        run: cibuildwheel python --output-dir wheelhouse
        env:
          CIBW_ENVIRONMENT: "URD_JOBS=2 CMAKE_BUILD_PARALLEL_LEVEL=2"
          CIBW_PLATFORM: macos
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          CIBW_ARCHS: "${{ matrix.architecture }}"
          CIBW_BUILD_VERBOSITY: "1"

      - name: Upload macOS wheels artifact
        uses: actions/upload-artifact@v5
        with:
          name: native-wheels-macos-${{ matrix.python-version }}-${{ matrix.architecture }}
          path: wheelhouse/*.whl

  github_release:
    needs:
      - build_native_sdist
      - build_corresponding_source
      - build_native_wheels_linux
      - build_native_wheels_macos
    runs-on: ubuntu-latest

    if: github.repository_owner == 'planning-and-learning'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check version matches tag
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml', 'rb'))['project']['version'])")
          TAG=${GITHUB_REF#refs/tags/native-v}

          echo "Package version: $VERSION"
          echo "Git tag: $TAG"

          if [ "$VERSION" != "$TAG" ]; then
            echo "Version mismatch: python/pyproject.toml=$VERSION tag=$TAG"
            exit 1
          fi

      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          pattern: native-wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v5
        with:
          name: native-sdist
          path: dist

      - name: Download corresponding-source bundle
        uses: actions/download-artifact@v5
        with:
          name: corresponding-source
          path: release-assets

      - name: Inspect release assets
        run: find dist release-assets -maxdepth 1 -type f

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* release-assets/* --verify-tag --generate-notes

  publish:
    needs: github_release
    runs-on: ubuntu-latest

    if: github.repository_owner == 'planning-and-learning'

    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          pattern: native-wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v5
        with:
          name: native-sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
