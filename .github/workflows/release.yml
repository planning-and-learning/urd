name: Release

# pyurd: urd's headers and CMake package, one wheel for every platform, and its source distribution. It pins
# pyurd-native (release-native.yml), which must be on PyPI first.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build frontend
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir build

      - name: Build source distribution and wheel
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: pyurd
          path: dist/*

  github_release:
    needs: build
    runs-on: ubuntu-latest

    if: github.repository_owner == 'planning-and-learning'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check version matches tag
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG=${GITHUB_REF#refs/tags/v}

          echo "Package version: $VERSION"
          echo "Git tag: $TAG"

          if [ "$VERSION" != "$TAG" ]; then
            echo "Version mismatch: pyproject.toml=$VERSION tag=$TAG"
            exit 1
          fi

      - name: Download pyurd
        uses: actions/download-artifact@v5
        with:
          name: pyurd
          path: dist

      - name: Inspect release assets
        run: find dist -maxdepth 1 -type f

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  publish:
    needs: github_release
    runs-on: ubuntu-latest

    if: github.repository_owner == 'planning-and-learning'

    permissions:
      id-token: write

    steps:
      - name: Download pyurd
        uses: actions/download-artifact@v5
        with:
          name: pyurd
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
