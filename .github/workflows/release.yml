name: Release

# pyurd: urd's headers and CMake package, one wheel for every platform, and its source distribution. It pins
# pyurd-native (release-native.yml), which must be on PyPI first.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build frontend
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir build

      - name: Build source distribution and wheel
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: pyurd
          path: dist/*

  github_release:
    needs: build
    runs-on: ubuntu-latest

    if: github.repository_owner == 'planning-and-learning'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check version matches tag
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG=${GITHUB_REF#refs/tags/v}

          echo "Package version: $VERSION"
          echo "Git tag: $TAG"

          if [ "$VERSION" != "$TAG" ]; then
            echo "Version mismatch: pyproject.toml=$VERSION tag=$TAG"
            exit 1
          fi

      - name: Download pyurd
        uses: actions/download-artifact@v5
        with:
          name: pyurd
          path: dist

      - name: Inspect release assets
        run: find dist -maxdepth 1 -type f

      # The notes name the pyurd-native release this pyurd pins, whose assets hold the corresponding source of the
      # native dependencies; the generated changelog follows them.
      - name: Write release notes
        run: |
          NATIVE=$(python -c "
          import tomllib
          pins = [d for d in tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies'] if d.startswith('pyurd-native==')]
          assert len(pins) == 1, f'pyurd must pin pyurd-native exactly once: {pins}'
          print(pins[0].removeprefix('pyurd-native=='))")
          cat > release-notes.md <<EOF
          pyurd ${GITHUB_REF_NAME#v} depends on \`pyurd-native==${NATIVE}\`, which ships urd's native dependencies in binary form. Their corresponding source (pyurd-native's source distribution with the dependencies' build scripts and patches, and the exact upstream sources) is \`pyurd_native-${NATIVE}-corresponding-source.tar.gz\` in the [native-v${NATIVE} release](https://github.com/${GITHUB_REPOSITORY}/releases/tag/native-v${NATIVE}).
          EOF
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes "$(cat release-notes.md)" --generate-notes

  publish:
    needs: github_release
    runs-on: ubuntu-latest

    if: github.repository_owner == 'planning-and-learning'

    permissions:
      id-token: write

    steps:
      - name: Download pyurd
        uses: actions/download-artifact@v5
        with:
          name: pyurd
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
